name: Daily job harvest

# Runs on GitHub's runners, which have unrestricted internet access - unlike the
# Claude session container, whose egress policy only permits GitHub. The Action
# fetches and scores, commits the results, and Claude reads them from the repo.

on:
  schedule:
    # 05:30 UTC daily = 07:30 Vienna in summer, 06:30 in winter.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual run'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and score
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python pipeline/fetch.py

      - name: Resolve apply links and recruiting addresses
        continue-on-error: true
        run: python pipeline/enrich.py 40

      - name: Job summary
        if: always()
        run: |
          if [ -f data/digest.md ]; then
            head -c 60000 data/digest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No digest produced - the run failed before scoring.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit results
        run: |
          git config user.name  'job-harvester[bot]'
          git config user.email 'job-harvester@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'No change in job data.'
          else
            git commit -m "data: job harvest $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((2 ** i))
            done
            exit 1
          fi
