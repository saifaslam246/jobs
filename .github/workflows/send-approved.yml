name: Send approved outreach

# Sends only what is already marked approved in outreach/queue/. Drafting is Claude's
# job, approving is Saif's; this workflow is purely the postman.

on:
  schedule:
    # Several attempts across the morning, not one. GitHub queues scheduled workflows
    # on a best-effort basis: the first run of this workflow fired at 14:58 UTC
    # instead of 08:10 and two applications landed at 16:58 Vienna. send.py refuses to
    # send outside SEND_WINDOW_UTC, so a run that arrives late does nothing and the
    # mail waits for the next morning rather than going out at the end of the day.
    - cron: '10 6,7,8,9,10 * * 1-5'
  workflow_dispatch:
    inputs:
      daily_cap:
        description: 'Maximum emails this run'
        required: false
        default: '10'
      force:
        description: 'Send even outside the morning window'
        required: false
        default: 'no'

permissions:
  contents: write

concurrency:
  group: send-approved
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          DAILY_CAP: ${{ github.event.inputs.daily_cap || '10' }}
          SEND_WINDOW_UTC: '06:00-11:00'
          # A manual run is a deliberate act, so it may send at any hour.
          FORCE_SEND: ${{ github.event.inputs.force == 'yes' && '1' || '0' }}
        run: python outreach/send.py | tee "$GITHUB_STEP_SUMMARY"

      - name: Record what was sent
        run: |
          git config user.name  'job-harvester[bot]'
          git config user.email 'job-harvester@users.noreply.github.com'
          git add outreach/queue/
          if git diff --staged --quiet; then
            echo 'Nothing sent.'
          else
            git commit -m "outreach: send log $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              sleep $((2 ** i))
            done
            exit 1
          fi
